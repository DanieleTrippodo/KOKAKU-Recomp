; KokakuNative (Ghost in the Shell: Stand Alone Complex)
; DirectX 12 Hardware Native Port Configuration

[Display]
Enabled=true
ResolutionMode=Custom
Width=1920
Height=1080
Fullscreen=false
AspectRatio=Preserve
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true

[Rendering]
Backend=DirectX12
HardwareTransform=true
DX12GEColor=true
AsyncGE=false
TextureCacheEntries=16384
TextureCacheMB=2048
InternalResolutionMode=Custom
InternalScale=4
InternalWidth=1920
InternalHeight=1080
MSAA=2
SMAA=false
AnisotropicFiltering=16
DepthPrecision=24
ExperimentalGpuColorPreview=false
GeometryDebugColors=false
DumpGpuFrameVblank=0

[Timing]
FrameRate=60
RealtimeSpeedDiagnostics=false
RealtimeSpeedIntervalVblanks=240

[Gameplay]
; Campaign: 40% player HP, +60% enemy damage, -30% soldier attack pauses.
; Autonomous companion damage -95%; more lateral patrol/assault movement.
; Always inactive in multiplayer, even with PCBalance=true.
; Changes apply when the next mission/area loads.
PCBalance=true

[Audio]
Enabled=true
Volume=100
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=true
AspectRatio=auto

[Controls]
CameraStick=true
MouseSensitivity=15
InvertCameraY=false
ModernControlScheme=true

[Diagnostics]
LogToFile=true
LogFile=KokakuNative.log
FlushEveryLine=false

[Network]
Enabled=true
; Online=true: Create opens a room, Join shows the list of rooms on the
; internet and on the local network. Online=false: the original behaviour,
; Join enters the first room found on the local network.
Online=true
; Name shown to other players. The stock MajorKusanagi becomes an automatic
; Agent-1234; write your own name here.
Nickname=MajorKusanagi
; Internet room list. Empty: the built-in address. off: local network only.
Lobby=
MAC=auto
; UDP port for game traffic, plus PortOffset for a second copy on one PC.
Port=3658
PortOffset=0
